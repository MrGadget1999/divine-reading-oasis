<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Reading Oasis</title>
    <script type="text/javascript">
      console.log("404.html script running"); // Add this line
      var segmentCount = 1; // Changed from pathSegmentsToKeep for clarity
      var l = window.location;
      // Add error handling for the redirect//
      try {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } catch (e) {
        console.error('Redirect failed:', e); // Add this line
        window.location.href = '/divine-reading-oasis/'; // Fallback to home page if redirect fails
      }
    </script>
  </head>
  <body>
    <noscript>
      Redirecting... If not redirected, <a href="/divine-reading-oasis/">click here</a>
    </noscript>
  </body>
</html>
